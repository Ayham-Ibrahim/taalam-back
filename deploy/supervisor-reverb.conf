; خادم WebSocket للمحادثة اللحظية (Laravel Reverb) — بدونه تعمل المحادثة عبر HTTP فقط:
; الرسائل تُحفظ وتُجلب، لكن لا شيء يصل لحظياً (لا رسالة جديدة، ولا "يكتب الآن"،
; ولا عداد الهيدر) إلا بعد تحديث الصفحة. فشل البث لا يُفشل الإرسال (BroadcastsAfterCommit).
;
; التثبيت على السيرفر (VPS بصلاحية root):
;   cp deploy/supervisor-reverb.conf /etc/supervisor/conf.d/taalam-reverb.conf
;   # عدّل المسارات أدناه إن اختلف مسار المشروع عن /var/www/staging_back
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start taalam-reverb
;
; للتأكد أنه يعمل باستمرار: supervisorctl status taalam-reverb
; بعد كل نشر: php artisan reverb:restart (يعيد Supervisor تشغيله بالكود الجديد)

[program:taalam-reverb]
directory=/var/www/staging_back
; حد الملفات المفتوحة لـ www-data على السيرفر 1024 — كل اتصال WebSocket ملف مفتوح، فيُرفع
; لهذه العملية وحدها. (minfds لا يصلح هنا: مكانه قسم [supervisord] ويخص supervisord نفسه)
; فوق ~1000 اتصال متزامن تحتاج حلقة Reverb امتداد ext-uv (حلقة stream_select الافتراضية
; محدودة بـ 1024) — راجع توثيق Reverb "Production" قبل الوصول لذلك الحجم.
command=bash -c "ulimit -n 10000 && exec php /var/www/staging_back/artisan reverb:start --host=127.0.0.1 --port=8080"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/staging_back/storage/logs/reverb.log
