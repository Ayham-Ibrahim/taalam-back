; Laravel queue worker (QUEUE_CONNECTION=database) — بدون هذا الملف، أي إشعار
; (تذكير جلسة، بريد ترحيبي، دعوة معلم...) يُدفَع فقط إلى جدول jobs ولا يُنفَّذ أبداً
; إلا إذا شغَّل أحدهم "php artisan queue:work" يدوياً ثم أوقفه — وهو بالضبط سبب أن
; بعض الإشعارات (مثل تذكير الطالب) تُفقَد بصمت بينما تصل إشعارات أخرى (تذكير المعلم)
; التي صادف معالجتها أثناء تشغيل يدوي عابر للـ worker.
;
; التثبيت على السيرفر (VPS بصلاحية root):
;   apt install -y supervisor          # إن لم يكن مثبتاً
;   cp deploy/supervisor-queue-worker.conf /etc/supervisor/conf.d/taalam-queue-worker.conf
;   # عدّل المسارات أدناه إن اختلف مسار المشروع عن /var/www/staging_back
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start taalam-queue-worker:*
;
; للتأكد أنه يعمل باستمرار: supervisorctl status taalam-queue-worker:*

[program:taalam-queue-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/staging_back
command=php /var/www/staging_back/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/staging_back/storage/logs/queue-worker.log
stopwaitsecs=3600
