; يرفع حد PHP الفعلي لحجم الرفع (لا حد Laravel وحده) — صور كاميرا الهاتف
; الحديثة قد تتجاوز الحد الافتراضي الشائع لدى مزوّدي الاستضافة (2M غالباً)،
; فيفشل الرفع بخطأ عام "The file failed to upload" قبل وصول الملف لأي تحقق
; في الكود أصلاً (raised alongside UploadAvatarRequest/UploadVerificationDocumentRequest's
; own max:15360 KB rule — كلا الحدّين يجب أن يتوافقا).
;
; يُقرأ هذا الملف تلقائياً من PHP عند تشغيله كـ PHP-FPM/CGI (الوضع الشائع لدى
; أغلب الاستضافات المشتركة)؛ يُتجاهَل بصمت وبأمان إن كان الخادم يشغّل PHP
; كوحدة Apache (mod_php) — لا خطر من وجوده في كلتا الحالتين.
upload_max_filesize = 20M
post_max_size = 21M
